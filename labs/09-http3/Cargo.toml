[package]
name = "http3"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
quinn = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
